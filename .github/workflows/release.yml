name: Build Tagged Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string
      build_android_apk:
        description: Build the compiled Android APK (JDK 17 + Android SDK/NDK)
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: tagged-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive
      - name: Verify required submodules
        run: |
          set -euo pipefail
          git submodule status --recursive
          test -s libraries/kristal-i18n/lib.lua
          test -s libraries/kristal-object-selector-plus/lib.lua
          test -s libraries/terminal-cli/lib.lua
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y just jq love luajit rsync unzip xvfb zip
      - name: Verify source and version
        run: |
          make test
          version="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('mod.json').read_text(encoding='utf-8')
          match = re.search(r'(?m)^\s*"version"\s*:\s*"([^"]+)"', text)
          if not match:
              raise SystemExit('Could not find mod.json version')
          print(match.group(1))
          PY
          )"
          test "$version" = "$RELEASE_TAG"
      - name: Set up JDK 17
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_android_apk }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_android_apk }}
        shell: pwsh
        run: ./.github/scripts/setup-android-sdk.ps1

      - name: Install Android API and NDK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_android_apk }}
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

      - name: Prepare stable Android release signing
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_android_apk }}
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          python3 .github/scripts/android-release.py prepare \
            --tag "$RELEASE_TAG" --env-prefix DELTARUNE_DDD_CH1 \
            --keystore "$RUNNER_TEMP/android-release.jks" --output-env "$GITHUB_ENV"

      - name: Build release assets
        run: |
          just build
          ./.github/scripts/build_mod.sh

      - name: Build Android APK (compile)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_android_apk }}
        run: ./tools/build_android.sh

      - name: Verify signed Android release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_android_apk }}
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          python3 .github/scripts/android-release.py verify \
            --apk dist/deltarune-ddd-ch1-android.apk --tag "$RELEASE_TAG" \
            --certificate "$ANDROID_SIGNING_CERT_SHA256" \
            --application-id "${DELTARUNE_DDD_CH1_ANDROID_APPLICATION_ID:-org.deltarunedddch1.template}"

      - name: Remove temporary Android release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.jks"

      - name: Package full source with submodules
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          mkdir -p dist
          # Unlike GitHub's auto-generated archives, include the checked-out
          # submodule contents so the mod is complete and usable as-is.
          tar --exclude='.git' --exclude='.build' --exclude='dist*' --exclude='.tools' --exclude='.worktrees' \
            -czf "dist/deltarune-ddd-ch1-$TAG-full-source.tar.gz" -C "$PWD" .
          (cd "$PWD" && zip -qr "dist/deltarune-ddd-ch1-$TAG-full-source.zip" . \
            -x '.git*' '.build*' 'dist*' '.tools*' '.worktrees*')

      - name: Verify packaged runtime libraries
        run: |
          python3 .github/scripts/verify-package-libraries.py dist/deltarune-ddd-ch1-mod.zip --mod-id deltarune-ddd-ch1
          python3 .github/scripts/verify-package-libraries.py dist/deltarune-ddd-ch1-release.love --mod-id deltarune-ddd-ch1
          for apk in dist/*.apk; do
            [ -f "$apk" ] || continue
            python3 .github/scripts/verify-package-libraries.py "$apk" --mod-id deltarune-ddd-ch1
          done
      - name: Generate and verify SHA-256 manifest
        run: |
          .github/scripts/generate_sha256sums.sh dist
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: deltarune-ddd-ch1-${{ env.RELEASE_TAG }}
          path: dist/
          if-no-files-found: error
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "deltarune-ddd-ch1 $RELEASE_TAG" --generate-notes
          fi
          files=()
          for pattern in '*.love' '*-win64.zip' '*-mod.zip' '*.apk' '*-full-source.tar.gz' '*-full-source.zip'; do
            while IFS= read -r -d '' f; do files+=("$f"); done < <(find dist -maxdepth 1 -type f -name "$pattern" -print0)
          done
          files+=(dist/SHA256SUMS)
          test "${#files[@]}" -gt 0
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
